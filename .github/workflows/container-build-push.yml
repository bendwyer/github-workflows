---
name: container-build-push

on:
  workflow_call:
    inputs:
      filter_file_path:
        description: Path to YAML file populated with filters.
        required: false
        default: .github/filters.yml
        type: string
      images_root_folder:
        description: Root folder where images are stored. Must include trailing slash.
        required: false
        default: images/
        type: string

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.filter.outputs.changes || steps.all.outputs.images }}
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Get all images for scheduled/manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: all
        run: |
          # Extract all keys from filters.yml and format as JSON array
          images=$(yq eval 'keys' ${{ inputs.filter_file_path }} | yq eval -o=json '.' | jq -c '.')
          echo "images=${images}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Detect changed images
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: ${{ inputs.filter_file_path }}

      # Resolved once and consumed by both build and merge. Resolving in each
      # job separately let an upstream release land between them and tag the
      # image with a version it does not contain.
      - name: Resolve image versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          images='${{ steps.filter.outputs.changes || steps.all.outputs.images }}'
          versions='{}'
          for image in $(jq -r '.[]?' <<< "${images:-[]}"); do
            folder="${{ inputs.images_root_folder }}${image}"
            if [[ -f "${folder}/get-version.sh" ]]; then
              version=$(cd "${folder}" && bash get-version.sh)
            else
              version=main
            fi
            if [[ -z "$version" || "$version" == "null" ]]; then
              echo "::error::get-version.sh for ${image} returned '${version}'"
              exit 1
            fi
            versions=$(jq -c --arg i "$image" --arg v "$version" '. + {($i): $v}' <<< "$versions")
          done
          echo "versions=${versions}" >> $GITHUB_OUTPUT
        shell: bash

  build:
    needs:
      - changes
    if: needs.changes.outputs.images != '' && toJson(fromJson(needs.changes.outputs.images)) != '[]'
    runs-on: ${{ matrix.runners }}
    strategy:
      fail-fast: false
      matrix:
        runners:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        images: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.images }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.images_root_folder }}${{ matrix.images }}
          build-args: |
            VERSION=${{ fromJSON(needs.changes.outputs.versions)[matrix.images] }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.images }}
          provenance: false
          outputs: type=image,push-by-digest=${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }},name-canonical=true,push=${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
        shell: bash

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digests-${{ matrix.images }}-${{ matrix.runners == 'ubuntu-24.04' && 'linux-amd64' || 'linux-arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - build
      - changes
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && needs.changes.outputs.images != '' && toJson(fromJson(needs.changes.outputs.images)) != '[]'
      && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    strategy:
      # One image failing to resolve its version must not cancel the manifest
      # push for every other image in the matrix.
      fail-fast: false
      matrix:
        images: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.images }}-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version for image
        id: version
        run: |
          VERSION='${{ fromJSON(needs.changes.outputs.versions)[matrix.images] }}'
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" != "main" ]]; then
            # Split version into components
            IFS='.' read -ra PARTS <<< "$VERSION"
            echo "major=${PARTS[0]}" >> $GITHUB_OUTPUT
            echo "minor=${PARTS[1]}" >> $GITHUB_OUTPUT
            echo "patch=${PARTS[2]}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.images }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}/${{ matrix.images }}@sha256:%s ' *)
        shell: bash

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}/${{ matrix.images }}:${{ steps.version.outputs.version }}
        shell: bash

  cleanup:
    needs:
      - build
      - merge
      - changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        images: ${{ fromJSON(needs.changes.outputs.images) }}
    permissions:
      packages: write
    steps:
      - name: Delete old images for ${{ matrix.images }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}/${{ matrix.images }}
          keep-n-tagged: 5
          older-than: 90 days
          delete-untagged: true
